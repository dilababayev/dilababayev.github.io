<h2> Variables and Data Types</h2>
<p> Variable = named storage location in memory.</p>
<p>Primitive types:</p>
<p>int → whole numbers</p>
<p>double → decimals</p>
<p>boolean → true/false</p>
<p>char → single character</p>
<p>Reference types (e.g., String) → store references to objects.</p>
<p>Must be declared before use</p>
